spring:
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
server:
  port: 8080
jwt:
  secret: 0123456789abcdef0123456789abcdef
app:
  password-reset:
    link-base: http://localhost:8080/reset-password?token=
    expiry-minutes: 30
logging:
  level:
    com.example.user.config: INFO