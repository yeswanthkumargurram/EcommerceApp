spring:
  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  elasticsearch:
    uris: http://localhost:9200
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
server:
  port: 8081
jwt:
  secret: 0123456789abcdef0123456789abcdef
springdoc:
  swagger-ui:
    enabled: false
logging:
  level:
    com.example.product.search: DEBUG
    com.example.product.config: INFO
    org.springframework.data.elasticsearch.client.WIRE: trace
